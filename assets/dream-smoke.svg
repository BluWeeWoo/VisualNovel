<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800">
  <defs>
    <filter id="smoke" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .007" numOctaves="4" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .055  0 0 0 0 .05  0 0 0 0 .08  3.5 0 0 0 -1.2"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="480" height="800" filter="url(#smoke)"/>
</svg>
